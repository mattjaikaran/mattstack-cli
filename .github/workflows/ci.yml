name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Format check
        run: uv run ruff format --check src/ tests/
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Typecheck
        run: uv run mypy src/
      - name: Security scan
        run: uv run bandit -r src/ -c pyproject.toml
      - name: Architecture check
        run: python scripts/check_architecture.py
      - name: File length check
        run: python scripts/check_file_length.py
      - name: Test
        run: uv run pytest -x -q --tb=short
      - name: Install check
        run: uv pip install -e .
